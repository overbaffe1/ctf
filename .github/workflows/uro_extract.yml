name: uro-extract
on:
  push:
    paths:
      - '.github/workflows/uro_extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          (sudo apt-get install -y -qq p7zip-full 2>&1 | tail -3) || true
          (sudo apt-get install -y -qq unrar 2>&1 | tail -3) || true
          (sudo apt-get install -y -qq unrar-free 2>&1 | tail -3) || true
          echo "--- avail:"; command -v 7z || true; command -v unrar || true; command -v unrar-free || true; command -v bsdtar || true; python3 -c "import libarchive" 2>&1 || true
      - name: extract
        continue-on-error: true
        run: |
          mkdir -p uro_extract/mmmm
          set +e
          : > uro_extract/LOG.txt
          echo "== tools ==" >> uro_extract/LOG.txt
          (command -v 7z; command -v 7za; command -v unrar; command -v unrar-free; command -v bsdtar) >> uro_extract/LOG.txt 2>&1
          echo "== listing мmmm ==" >> uro_extract/LOG.txt
          7z l -slt "мммм.rar" >> uro_extract/LOG.txt 2>&1
          echo "== extract ==" >> uro_extract/LOG.txt
          7z x -y -ouro_extract/mmmm "мммм.rar" >> uro_extract/LOG.txt 2>&1
          echo "== fallback unrar ==" >> uro_extract/LOG.txt
          unrar x -o+ "мммм.rar" uro_extract/mmmm/ >> uro_extract/LOG.txt 2>&1
          echo "== fallback bsdtar ==" >> uro_extract/LOG.txt
          bsdtar -xf "мммм.rar" -C uro_extract/mmmm >> uro_extract/LOG.txt 2>&1
          echo "== result ==" >> uro_extract/LOG.txt
          ls -laR uro_extract/mmmm >> uro_extract/LOG.txt 2>&1
          for a in "БЕНs.part1.rar" "тасs.part1.rar" "Baby.part1.rar"; do
            echo "== $a ==" >> uro_extract/LOG.txt
            7z l -slt "$a" >> uro_extract/LOG.txt 2>&1 | head -60
          done
          find uro_extract -type f -size +12M -delete
          echo "SUCCESS" >> uro_extract/LOG.txt
      - name: commit
        if: always()
        run: |
          git config user.name "cdn-bot"
          git config user.email "cdn-bot@users.noreply.github.com"
          git add -A uro_extract
          git commit -m "uro extract" || echo nothing
          git push
