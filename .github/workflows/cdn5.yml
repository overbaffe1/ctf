name: cdn-dump5
on:
  push:
    paths:
      - '.github/workflows/cdn5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          BASE="https://c60f0a03899a4ea4.xn--80aqf1ad.xn--r1aee.xn--80afol2bmm.xn--p1acf"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          mkdir -p cdn_dump/raw5
          : > cdn_dump/log5.txt
          get() {
            code=$(curl -k -sS -L --max-time 25 -A "$UA" -H "Accept: */*" \
              -D "cdn_dump/raw5/$1.hdr" -o "cdn_dump/raw5/$1.bin" -w '%{http_code} %{size_download} %{content_type}' "$2" 2>>cdn_dump/log5.txt)
            echo "$1 $code $2" >> cdn_dump/log5.txt
          }
          get swpost   "$BASE/sw.js"
          get manifestv2 "$BASE/asset-manifest.json?v=2"
          get orig17 "$BASE/originals/press-17"
          get orig23 "$BASE/originals/press-23"
          get img04png "$BASE/image/press-04?w=640&format=png"
          get img04noquery "$BASE/image/press-04"
          get img17noquery "$BASE/image/press-17"
          get img23noquery "$BASE/image/press-23"
          get img17avif "$BASE/image/press-17?w=2048&format=avif"
          get img04avif "$BASE/image/press-04?w=2048&format=avif"
          get xmp04 "$BASE/metadata/press-04.xmp"
          get xmp17 "$BASE/metadata/press-17.xmp"
          get xmp23 "$BASE/metadata/press-23.xmp"
          get orig04head "$BASE/originals/press-04?v=cc8d2db658ed"
          get favicon "$BASE/favicon.ico"
          cat cdn_dump/log5.txt
      - name: commit
        run: |
          git config user.name "cdn-bot"
          git config user.email "cdn-bot@users.noreply.github.com"
          git add -A cdn_dump
          git commit -m "cdn dump5" || echo nothing
          git push
