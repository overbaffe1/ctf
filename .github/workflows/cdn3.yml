name: cdn-dump3
on:
  push:
    paths:
      - '.github/workflows/cdn3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          BASE="https://c60f0a03899a4ea4.xn--80aqf1ad.xn--r1aee.xn--80afol2bmm.xn--p1acf"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          mkdir -p cdn_dump/raw3
          : > cdn_dump/log3.txt
          get() {
            code=$(curl -k -sS -L --max-time 25 -A "$UA" -H "Accept: */*" \
              -D "cdn_dump/raw3/$1.hdr" -o "cdn_dump/raw3/$1.bin" -w '%{http_code} %{size_download} %{content_type}' "$2" 2>>cdn_dump/log3.txt)
            echo "$1 $code $2" >> cdn_dump/log3.txt
          }
          get xmp04 "$BASE/metadata/press-04.xmp"
          get xmp17 "$BASE/metadata/press-17.xmp"
          get xmp23 "$BASE/metadata/press-23.xmp"
          get manifest "$BASE/asset-manifest.json"
          get robots "$BASE/robots.txt"
          get sitemap "$BASE/sitemap.xml"
          get meta "$BASE/metadata/"
          get root "$BASE/"
          get admin "$BASE/admin"
          get debug "$BASE/debug"
          get health "$BASE/health"
          get flag "$BASE/flag"
          get press01 "$BASE/image/press-01?w=64&format=png"
          get xmpjson "$BASE/metadata/press-04.json"
          get xmpother "$BASE/metadata/press-04"
          head -c 4000 cdn_dump/raw3/xmp04.bin || true
      - name: commit
        run: |
          git config user.name "cdn-bot"
          git config user.email "cdn-bot@users.noreply.github.com"
          git add -A cdn_dump
          git commit -m "cdn dump3" || echo nothing
          git push
