name: cdn-dump2
on:
  push:
    paths:
      - '.github/workflows/cdn2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          BASE="https://c60f0a03899a4ea4.xn--80aqf1ad.xn--r1aee.xn--80afol2bmm.xn--p1acf"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          mkdir -p cdn_dump/raw2
          : > cdn_dump/log2.txt
          get() {
            code=$(curl -k -sS -L --max-time 25 -A "$UA" -H "Accept: */*" \
              -D "cdn_dump/raw2/$1.hdr" -o "cdn_dump/raw2/$1.bin" -w '%{http_code} %{size_download} %{content_type}' "$2" 2>>cdn_dump/log2.txt)
            echo "$1 $code $2" >> cdn_dump/log2.txt
          }
          get manifest "$BASE/asset-manifest.json"
          get sw "$BASE/sw.js"
          get avif04 "$BASE/image/press-04?w=2048&format=avif"
          get avif17 "$BASE/image/press-17?w=2048&format=avif"
          get avif23 "$BASE/image/press-23?w=2048&format=avif"
          get big04 "$BASE/image/press-04?w=2048&format=png"
          get big17 "$BASE/image/press-17?w=2048&format=png"
          get big23 "$BASE/image/press-23?w=2048&format=png"
          get w2048j "$BASE/image/press-04?w=2048"
          get w1024 "$BASE/image/press-04?w=1024&format=png"
          get f_avif "$BASE/image/press-04?format=avif"
          grep -iE "content-type|content-length|x-brandguard|x-asset" cdn_dump/raw2/manifest.hdr
      - name: commit
        run: |
          git config user.name "cdn-bot"
          git config user.email "cdn-bot@users.noreply.github.com"
          git add -A cdn_dump
          git commit -m "cdn dump2" || echo nothing
          git push
