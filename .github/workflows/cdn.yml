name: cdn-dump
on:
  push:
    paths:
      - '.github/workflows/cdn.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch assets
        run: |
          BASE="https://c60f0a03899a4ea4.xn--80aqf1ad.xn--r1aee.xn--80afol2bmm.xn--p1acf"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          mkdir -p cdn_dump/raw
          : > cdn_dump/log.txt
          get() { # name url
            code=$(curl -k -sS -L --max-time 25 -A "$UA" -H "Accept: image/avif,image/webp,image/png,image/*,*/*;q=0.8" \
              -D "cdn_dump/raw/$1.hdr" -o "cdn_dump/raw/$1.bin" -w '%{http_code} %{size_download} %{content_type}' "$2" 2>>cdn_dump/log.txt)
            echo "$1 $code $2" >> cdn_dump/log.txt
          }
          get root "$BASE/"
          get robots "$BASE/robots.txt"
          get sitemap "$BASE/sitemap.xml"
          for p in 04 17 23; do
            case $p in
              04) v=5d2421957372;;
              17) v=61b7610ed775;;
              23) v=e3384cb9fd5c;;
            esac
            get img_${p}_640_webp "$BASE/image/press-$p?w=640&format=webp&v=$v"
            get img_${p}_noq "$BASE/image/press-$p"
            get img_${p}_png "$BASE/image/press-$p?format=png"
            get img_${p}_jpg "$BASE/image/press-$p?format=jpg"
            get img_${p}_orig_w "$BASE/image/press-$p?w=4096&format=png"
            get orig_${p} "$BASE/originals/press-$p"
          done
          get orig_04v "$BASE/originals/press-04?v=cc8d2db658ed"
          get orig_17v "$BASE/originals/press-17?v=b0b8b6757e16"
          get orig_23v "$BASE/originals/press-23?v=ec7d80ad89bf"
          for n in 01 02 03 05 06 07 08 09 10 11 12 13 14 15 16 18 19 20 21 22 24 25 26 27 28 29 30; do
            get probe_$n "$BASE/image/press-$n"
          done
          ls -la cdn_dump/raw | head -50
      - name: commit
        run: |
          git config user.name "cdn-bot"
          git config user.email "cdn-bot@users.noreply.github.com"
          git add -A cdn_dump
          git commit -m "cdn dump" || echo "nothing"
          git push
